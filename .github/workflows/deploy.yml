name: Docker Deployment

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    # Checkout source code
    - name: Checkout Code
      uses: actions/checkout@v4


    # Configure AWS credentials
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4

      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ap-south-1


    # Upload static files to S3
    - name: Upload files to S3
      run: |

        aws s3 sync ./ \
        s3://kalyan-github-actions-bucket \
        --delete \
        --exclude ".git/*" \
        --exclude ".github/*"


    # Copy project files to EC2
    - name: Copy project to EC2
      uses: appleboy/scp-action@v0.1.7

      with:

        host: ${{ secrets.EC2_HOST }}

        username: ${{ secrets.EC2_USERNAME }}

        key: ${{ secrets.EC2_SSH_KEY }}

        source: "."

        target: "/home/ec2-user/Furniture"



    # Build and restart Docker container
    - name: Deploy Docker Container
      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ secrets.EC2_HOST }}

        username: ${{ secrets.EC2_USERNAME }}

        key: ${{ secrets.EC2_SSH_KEY }}

        script: |

          cd /home/ec2-user/Furniture


          echo "Stopping old container..."

          docker stop furniture-container || true


          echo "Removing old container..."

          docker rm furniture-container || true


          echo "Building Docker image..."

          docker build -t furniture-app .


          echo "Starting new container..."

          docker run -d \
          --restart always \
          -p 8080:80 \
          --name furniture-container \
          furniture-app


          echo "Deployment completed"


          docker ps
